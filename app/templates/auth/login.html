<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BK_Estudo_Proteção v2</title>
  <link rel="icon" type="image/png" href="/static/img/favicon-64.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-system.css">
</head>
<body>

  <div class="login-wrap">
    <div style="width:100%; max-width:400px;">
      <div class="login-card">
        <div class="login-head">
          <img src="/static/img/bk-logo-128.png" alt="BK Engenharia e Tecnologia">
          <h1>BK_Estudo_Proteção</h1>
          <p>Sistema Profissional de Proteção v2.0</p>
        </div>

        <div class="login-body">
          {% if error %}
          <div class="alert alert-danger mb-4">{{ error }}</div>
          {% endif %}

          <form id="loginForm">
            <div class="field">
              <label>Usuário</label>
              <input type="text" id="username" name="username" required class="input" placeholder="seu.usuario">
            </div>
            <div class="field">
              <label>Senha</label>
              <input type="password" id="password" name="password" required class="input" placeholder="••••••••">
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary w-full" style="justify-content:center; padding:11px;">
              Entrar no Sistema
            </button>
          </form>

          <div id="loginError" hidden class="alert alert-danger mt-3"></div>

          <div class="mt-6" style="padding-top:18px; border-top:1px solid var(--line); text-align:center;">
            <p class="text-xs text-soft" style="line-height:1.6;">
              Sistema de uso exclusivo para engenheiros habilitados.<br>
              Os resultados gerados requerem validação técnica profissional.
            </p>
          </div>
        </div>
      </div>

      <p class="login-foot">BK Engenharia e Tecnologia — BK_Estudo_Proteção v2.0</p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errDiv = document.getElementById('loginError');
      const originalText = btn.textContent;
      btn.textContent = 'Autenticando...';
      btn.disabled = true;
      errDiv.hidden = true;

      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (resp.ok) {
          window.location.href = '/dashboard';
        } else {
          const data = await resp.json().catch(() => ({}));
          errDiv.textContent = data.detail || 'Usuário ou senha incorretos.';
          errDiv.hidden = false;
        }
      } catch(e) {
        errDiv.textContent = 'Erro de conexão com o servidor.';
        errDiv.hidden = false;
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
