<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BK_Estudo_Proteção v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { 'bk-navy': '#1a3a5c', 'bk-orange': '#e07b39' } } } }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-bk-navy to-blue-900 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Card de login -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="bg-bk-navy px-8 py-8 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-bk-orange rounded-xl mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white">BK_Estudo_Proteção</h1>
        <p class="text-blue-300 text-sm mt-1">Sistema Profissional de Proteção v2.0</p>
      </div>

      <!-- Form -->
      <div class="px-8 py-8">
        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700 flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          {{ error }}
        </div>
        {% endif %}

        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Usuário</label>
            <input type="text" id="username" name="username" required
                   class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-bk-navy focus:border-transparent outline-none transition"
                   placeholder="seu.usuario">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Senha</label>
            <input type="password" id="password" name="password" required
                   class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-bk-navy focus:border-transparent outline-none transition"
                   placeholder="••••••••">
          </div>

          <button type="submit" id="loginBtn"
                  class="w-full bg-bk-navy text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-blue-900 transition shadow-sm">
            Entrar no Sistema
          </button>
        </form>

        <div id="loginError" class="hidden mt-3 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>

        <!-- Aviso técnico -->
        <div class="mt-6 pt-5 border-t border-gray-100">
          <p class="text-xs text-gray-400 text-center leading-relaxed">
            Sistema de uso exclusivo para engenheiros habilitados.<br>
            Os resultados gerados requerem validação técnica profissional.
          </p>
        </div>
      </div>
    </div>

    <p class="text-center text-blue-300 text-xs mt-6">
      BK Engenharia e Tecnologia — BK_Estudo_Proteção v2.0
    </p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errDiv = document.getElementById('loginError');
      btn.textContent = 'Autenticando...';
      btn.disabled = true;
      errDiv.classList.add('hidden');

      try {
        const resp = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (resp.ok) {
          window.location.href = '/dashboard';
        } else {
          const data = await resp.json();
          errDiv.textContent = data.detail || 'Usuário ou senha incorretos.';
          errDiv.classList.remove('hidden');
        }
      } catch(e) {
        errDiv.textContent = 'Erro de conexão com o servidor.';
        errDiv.classList.remove('hidden');
      } finally {
        btn.textContent = 'Entrar no Sistema';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
